services:
  postgres:
    image: postgres:16-alpine
    container_name: tbo-postgres
    environment:
      POSTGRES_DB: tbo_inventory
      POSTGRES_USER: tbo
      POSTGRES_PASSWORD: tbo_local_password
    ports:
      - "5433:5432"
    volumes:
      - tbo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbo -d tbo_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tbo_postgres_data:
